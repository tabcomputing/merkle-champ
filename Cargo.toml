[package]
name = "merkle-champ"
version = "0.2.0"
edition = "2024"
description = "Persistent CHAMP hash map and set, and a persistent vector, with canonical shape, cached Merkle identities, and structural diff"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tabcomputing/merkle-champ"
keywords = ["champ", "hamt", "vector", "persistent", "merkle"]
categories = ["data-structures"]
exclude = ["bench-results/"]

[dependencies]
sha2 = "0.10"

[dev-dependencies]
imbl = "7.0"

[profile.release]
debug = false
